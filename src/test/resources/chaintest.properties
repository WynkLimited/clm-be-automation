# LOB ChainTest config — this file is first on the classpath and OVERRIDES
# automation-report.jar's chaintest.properties. Keep generator settings here
# or delete this file entirely to use the framework defaults.

chaintest.project.name=CLM BE Automation

# Attach scenario.log / attach under the current step (not only at scenario end)
chaintest.plugins.cucumber.attach-to-step=true

chaintest.storage.service.enabled=false

chaintest.generator.chainlp.enabled=false

chaintest.generator.simple.enabled=true
chaintest.generator.simple.document-title=CLM BE Automation Report
chaintest.generator.simple.class-name=com.aventstack.chaintest.generator.ChainTestSimpleGenerator
chaintest.generator.simple.offline=false
chaintest.generator.simple.dark-theme=true
# Required by ChainTestSimpleGenerator.flush (Map.of rejects null)
chaintest.generator.simple.js=
chaintest.generator.simple.css=

chaintest.generator.email.enabled=false
